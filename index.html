<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<script src="javascript.js" defer></script>
<body>
   <button id="rock" class="choice-btn"><img src="Images/Rock.jpeg" alt="Rock" title="Rock Image" height="200px" width="200px"></button>
   <button id="paper" class="choice-btn"><img src="Images/Paper.png" alt="Paper" title="Paper Image" height="200px" width="200px"></button>
   <button id="scissors" class="choice-btn"><img src="Images/Scissors.png" alt="Scissors" title="Scissors Image" height="200px" width="200px"></button> 
   <p id="score">Score: <br> <span class="human-score">Your Score:</span> <span class="computer-score">Computer Score:</span></p>
   <p id="round-result"></p>
   <p id="final-result"></p>
   <button id="reset">Reset</button>
</body>
</html>
